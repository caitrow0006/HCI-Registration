<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>UNH Course Registration Redesign</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <!--
        classes:
            area -- class is for areas such as the serach area or enrollments area
            area-heading -- for heading within areas
            search-input -- group containing a search input
            creative-button -- buttons that add to the UI or create results
            destructive-button -- buttons that remove from the UI or remove results
            neutral-button -- buttons that have a neutral (non destructive/non creative) function
            course-list -- div to contain a list of courses
            sidebar-icon -- image in a sidebar
            sidebar-icon-label -- sidebar icon label
            sidebar-icon-group -- div grouping icon and label for CSS styling
            dialog-text -- text within a dialog
        -->
        
        <!--sidebar-->
        <aside id="sidebar">
            <!--unh logo icon-->
            <ul class="sidebar-icons">
                
                <div class="sidebar-icon-group">
                <li><img class="sidebar-icon" id="logo-icon" src="images/unh_logo.png" alt=""></li>
                </div>

                <!--register icon-->
                <div class="sidebar-icon-group">
                <li><img class="sidebar-icon" id="register-icon" src="images/pencil.png" alt="image of a pencil"></li>
                <li><label class="sidebar-icon-label" for="register-icon">Register</label></li>
                </div>

                <!--plan icon-->
                <div class="sidebar-icon-group">
                <li><img class="sidebar-icon" id="plan-icon" src="images/light.png" alt="image of a lightbulb"></li>
                <li><label class="sidebar-icon-label" for="plan-icon">Plan</label></li>
                </div>

                <!--schedule icon-->
                <div class="sidebar-icon-group">
                <li><img class="sidebar-icon" id="schedule-icon" src="images/calendar.png" alt="image of a paper monthly calendar"></li>
                <li><label class="sidebar-icon-label" for="schedule-icon">Schedule</label></li>
                </div>
                
                <!--FAQ icon-->
                <div class="sidebar-icon-group">
                <li><img class="sidebar-icon" id="faq-icon" src="images/question.png" alt="image of a question mark"></li>
                <li><label class="sidebar-icon-label" for="faq-icon">Frequently Asked Questions</label></li>
                </div>
            </ul>
            
        </aside>

        <!--title area-->
        <!-- https://www.w3schools.com/html/html5_semantic_elements.asp -->
        <header id="title-area">
            <h1>Course Registration</h1>
        </header>
        
        <!--main area-->
        <main id="main-area">
            
            <!--search area-->
            <section class="area" id="search-area">
                
                <h2 class="area-heading" id="search-area-heading">Search for Courses</h2>
                
                <!-- https://www.w3schools.com/html/html_form_input_types.asp -->
                <!-- https://www.w3schools.com/tags/tag_textarea.asp -->
                
                <!--search by course title-->
                <div class="search_input" id="title-search">
                    <label id="title-search-label" for="title-search-input">Enter a Course Title:</label>
                    <input id="title-search-input" type="search" placeholder="Ex. Math425.01">
                </div>
                
                <!--search by crn-->
                <div class="search_input" id="crn-search">
                    <label id="crn-search-label" for="crn-search-input">Enter a Course Registration Number (CRN):</label>
                    <input id="crn-search-input" type="search" placeholder="Ex. 12345">
                </div>
                
                <!--search by wishlist-->
                <div class="search_input" id="wishlist-search">
                    <label id="wishlist-search-label" for="wishlist-search-input">Select a Course Wishlist:</label>
                    <!-- https://www.geeksforgeeks.org/html/html-dropdown/ -->
                    <select id="wishlist-search-select">
                        <!--TODO: Options should be populated by JavaScript based on what is in the API-->
                        <option value="default">No Wishlist Selected</option>
                        <!-- Add more options as needed -->
                    </select>
                </div>
                
                <!--complete search (button)-->
                <!-- https://www.w3schools.com/tags/tag_button.asp -->
                <button class="creative-button" id="search-button" type="button">Search</button>
                
                
            </section>
            
            <!--results area-->
            <section class="area" id="results-area">
                
                <h2 class="area-heading" id="results-area-heading">Search Results:</h2>
                    
                <!--search results list-->
                <div class="course-list" id="results-course-list">
                    <!--TODO: inputs and labels should be populated by JavaScript based on what is returned from the search-->
                    <input id="result1" type="checkbox">
                    <label class="course-item" for="result1">TODO: COURSE INFO -  JavaScript will take over this later</label>
                <p id = "resultsFromSearch">Hellooooo</p>
                    <!--TODO: the above ^^ will need to be removed longrun becuase JavaScript will takeover-->
                </div>
                
                <!--register button-->
                <button class="creative-button" id="register-button" type="button">Register</button>
                
            </section>
            
            <!--enrollments area-->
            <section class="area" id="enrollments-area">
                
                <h2 class="area-heading" id="enrollments-area-heading">Registered For:</h2>
                
                <!--enrollments list-->
                <div class="course-list" id="enrollments-course-list">
                    <!--TODO: inputs and labels should be populated by JavaScript based on what is returned from the search-->
                    <label class="course-item" for="enrollment1">TODO: COURSE INFO -  JavaScript will take over this later</label>
                    <!-- https://www.w3schools.com/tags/att_input_type_button.asp -->
                    <input class="destructive-button" id="enrollment1" type="button" value="Drop">
                    <p id = "cur-enrolls">No enrollments yet</p>
                    <!--TODO: the above ^^ will need to be removed longrun becuase JavaScript will takeover-->
                </div>
                
            </section>

            <p id = "error"></p>
            
        </main>

        <!-- dialog to pop up when an error occurs, with an error message -->
        <!-- TODO: JS should dynamically make it appear -->
        <dialog id="error-dialog">
            <p class="dialog-text" id="error-message">placeholder text (dynamically generated by JavaScript)<p>
            <button id="close-error-dialog" class="neutral-button">Dismiss Error</button>
        </dialog>
        
        <!-- dialog to to confirm dropping a course -->
        <!-- TODO: remove 'open' from the dialog opening tag to make it disappear. JS should dynamically make it appear -->
        <dialog id="drop-dialog" open>
            <p class="dialog-text" id="drop-message">Are you sure you want to drop (JavaScript fill in rest --> course title ex. Math425.01 "Calculus 1?")<p>
            <button id="cancel-drop" class="neutral-button">Cancel</button>
            <button id="confirm-drop" class="destructive-button">Confirm Drop</button>
        </dialog>
        
        <script src="script.js"></script>
    </body>
</html>
